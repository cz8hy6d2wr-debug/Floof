name: Mümmelwiese-Screenshots

# Startet die Mümmelwiese im Simulator mit Demo-Wiese und fotografiert
# Tag, Nacht, Shop und Album. Die Bilder landen auf dem Branch "ci-muemmelwiese-screenshots".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Neuestes Xcode wählen
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: App für den Simulator bauen
        run: |
          set -o pipefail
          xcodebuild -project Muemmelwiese/Muemmelwiese.xcodeproj -target Muemmelwiese -sdk iphonesimulator \
            -configuration Debug CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES ARCHS=arm64 \
            build 2>&1 | tail -5

      - name: Screenshots aufnehmen
        run: |
          set -e
          APP="Muemmelwiese/build/Debug-iphonesimulator/Muemmelwiese.app"
          [ -d "$APP" ] || APP="build/Debug-iphonesimulator/Muemmelwiese.app"
          BUNDLE="app.floof.muemmelwiese"
          mkdir -p shots
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          devs=[d for rt,ds in json.load(sys.stdin)['devices'].items() if 'iOS' in rt for d in ds if d['name'].startswith('iPhone 17 Pro')]
          print(devs[-1]['udid'])")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          for screen in day night shop album; do
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE" -MuemmelDemo YES -MuemmelScreen "$screen" -AppleLanguages "(de)" -AppleLocale de_DE >/dev/null
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/muemmelwiese-$screen.png" >/dev/null
            echo "📸 $screen"
          done

      - name: Auf Branch ablegen
        run: |
          cd shots
          git init -q -b ci-muemmelwiese-screenshots
          git add .
          git -c user.name="Floof CI" -c user.email="ci@users.noreply.github.com" \
            commit -q -m "Screenshots von ${GITHUB_SHA::7} [skip ci]"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-muemmelwiese-screenshots

      - name: Screenshots als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muemmelwiese-screenshots
          path: shots
          if-no-files-found: ignore
