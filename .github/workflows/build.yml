name: Build

# Kompiliert Floof auf einem Mac-Server von GitHub – ohne Signatur,
# nur um sicherzustellen, dass der Code baut.
on:
  push:
    branches-ignore: [ci-screenshots, ci-muemmelwiese-screenshots]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Neuestes Xcode wählen
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Verwende $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Für den Simulator bauen
        run: |
          set -o pipefail
          xcodebuild \
            -project Floof.xcodeproj \
            -target Floof \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Mümmelwiese für den Simulator bauen
        run: |
          set -o pipefail
          xcodebuild \
            -project Muemmelwiese/Muemmelwiese.xcodeproj \
            -target Muemmelwiese \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 \
            build 2>&1 | tee -a build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          test "$(grep -c 'BUILD SUCCEEDED' build.log)" -ge 2

      - name: Fehler zusammenfassen
        if: failure()
        run: |
          echo "### Compilerfehler" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" build.log | sort -u | head -100 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Build-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
